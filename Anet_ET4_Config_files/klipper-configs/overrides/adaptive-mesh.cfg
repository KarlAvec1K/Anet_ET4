# Retain klipper-macros BED_MESH_CALIBRATE_FAST for manual mesh commands.
# PRINT_START uses Klipper's native object-aware adaptive mesh instead.
[gcode_macro _km_mesh_if_needed]
rename_existing: _ET4_KM_MESH_IF_NEEDED_BASE
description: Uses Klipper native adaptive mesh for the current print objects.
gcode:
  {% if not printer.bed_mesh.profile_name %}
    _KM_BED_MESH_CALIBRATE_BASE ADAPTIVE=1
  {% endif %}
